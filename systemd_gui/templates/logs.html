{% extends "base.html" %}
{% block content %}
  <section class="panel" data-log-panel data-log-url="{{ url_for('logs_fragment') }}" data-refresh-enabled="{{ 'true' if log_refresh else 'false' }}" data-refresh-interval="{{ log_refresh_interval }}">
    <div class="panel-head">
      <div>
        <h2>Logs</h2>
        <p>Showing up to <span data-log-line-count>{{ log_lines }}</span> loaded lines from <code>{{ log_command_label }}</code>.</p>
      </div>
      <button class="ghost-button icon-button" type="button" data-log-maximize-panel title="Maximize log panel" aria-label="Maximize log panel" aria-pressed="false">{{ icon("maximize") }}</button>
    </div>
    <form class="log-controls" method="get" action="{{ url_for('logs') }}" data-log-controls>
      <label>
        Show newest
        <select name="lines" data-log-lines>
          {% for option in [50, 100, 200, 500, 1000] %}
            <option value="{{ option }}" {% if log_lines == option %}selected{% endif %}>{{ option }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        Read from each node
        <select name="per_node" data-log-per-node>
          {% for option in [50, 100, 200, 500, 1000] %}
            <option value="{{ option }}" {% if log_per_node == option %}selected{% endif %}>{{ option }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        Level
        <select name="priority" data-log-priority>
          {% for value, label in log_priority_options %}
            <option value="{{ value }}" {% if log_priority == value %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        Auto-refresh
        <select name="interval" data-log-interval>
          <option value="off" {% if not log_refresh %}selected{% endif %}>Off - manual</option>
          {% for option in [1, 2, 5, 10, 30] %}
            <option value="{{ option }}" {% if log_refresh and log_refresh_interval == option %}selected{% endif %}>Every {{ option }}s</option>
          {% endfor %}
        </select>
      </label>
      <label>
        Search loaded logs
        <input name="log_q" value="{{ request.args.get('log_q', '') }}" placeholder="Filter visible log lines" autocomplete="off" data-log-search>
      </label>
      <label class="toggle-label">
        <input name="wrap" type="checkbox" value="1" data-log-wrap {% if log_wrap %}checked{% endif %}>
        Wrap lines
      </label>
      <div class="log-node-select">
        <span class="log-node-select-title">Nodes</span>
        {% for node in log_node_options %}
          <label class="log-node-choice {{ node.log_color_class }} {% if node.disabled %}disabled{% endif %}" data-log-node-choice data-log-node-label="{{ node.log_label or node.label }}" data-loaded-count="{{ node.loaded_count or 0 }}" data-log-status="{{ node.log_status or 'ok' }}" data-log-status-message="{{ node.log_status_message or '' }}" title="{% if node.local %}Local node{% elif node.disabled %}No Remote API token saved{% else %}Remote API token saved{% endif %}">
            <input type="checkbox" name="node" value="{{ node.id }}" {% if node.selected %}checked{% endif %} {% if node.disabled %}disabled{% endif %}>
            <span>{{ node.label }}</span>
            <span class="log-node-count" data-log-node-count></span>
          </label>
        {% endfor %}
      </div>
      <button class="ghost-button" type="button" data-log-refresh-now>Refresh now</button>
      <a class="ghost-button" href="{{ url_for('logs_window', lines=log_lines, per_node=log_per_node, priority=log_priority if log_priority != 'all' else None, refresh='1' if log_refresh else None, interval=log_refresh_interval if log_refresh else None, log_q=request.args.get('log_q') or None, wrap='0' if not log_wrap else None) }}" target="_blank" rel="noopener noreferrer" data-log-window>Open window</a>
      <button class="ghost-button icon-button" type="button" data-log-maximize-output title="Maximize log messages" aria-label="Maximize log messages" aria-pressed="false">{{ icon("maximize") }}</button>
    </form>
    <div class="log-refresh-paused" data-log-refresh-paused hidden>Auto-refresh paused while text is selected.</div>
    <div class="log-search-status" data-log-search-status hidden></div>
    {% include "_service_logs.html" %}
  </section>
{% endblock %}
