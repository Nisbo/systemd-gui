{% if remote_nodes %}
  <div class="table-wrap compact-table remote-docker-table">
    <table>
      <tbody>
        {% for node in remote_nodes %}
          <tr class="remote-docker-row" id="remote-docker-{{ node.id }}" data-remote-docker-node-url="{{ url_for('docker_remote_node_fragment', node_id=node.id, state=docker_state or None) }}">
            <td>
              <div class="remote-docker-summary">
                <span class="remote-docker-title">
                  <strong>{{ node.name }}{% if node.version %} <span>({{ node.version }})</span>{% endif %}</strong>
                  <span class="muted">·</span>
                  <span class="muted">Loading remote containers...</span>
                </span>
                <span class="tag neutral">loading</span>
              </div>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% else %}
  <p class="empty-note">No saved nodes are configured yet.</p>
{% endif %}
