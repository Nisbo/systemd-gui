{% extends "base.html" %}
{% block content %}
  <section class="panel dashboard-hero">
    <div class="panel-head">
      <div>
        <h2>Dashboard</h2>
        <p>Quick status across this Systemd Gui node and saved nodes.</p>
      </div>
      <a class="tag neutral dashboard-version-link" href="{{ url_for('settings', tab='updates') }}">Version {{ app_version }}</a>
    </div>

    <div class="dashboard-fragment" data-dashboard-fragment-url="{{ url_for('dashboard_summary_fragment') }}">
      {% set summary = dashboard.fleet %}
      {% include "_dashboard_fleet_summary.html" %}
    </div>
  </section>
{% endblock %}
